<text x="380" y="299" fill="#616e7f">. <tspan fill="#ffa657">Data</tspan> .......... <tspan fill="#a5d6ff">PostgreSQL, MongoDB, Firebase, SQL</tspan></text>
<text x="380" y="322" fill="#616e7f">. <tspan fill="#ffa657">Cloud</tspan> ......... <tspan fill="#a5d6ff">AWS, Google Cloud, DigitalOcean</tspan></text>
<text x="380" y="345" fill="#616e7f">. <tspan fill="#ffa657">DevOps</tspan> ........ <tspan fill="#a5d6ff">Docker, CI/CD, serverless architectures</tspan></text>
<text x="380" y="368" fill="#616e7f">. <tspan fill="#ffa657">Testing</tspan> ....... <tspan fill="#a5d6ff">Jasmine, Karma, unit &amp; integration tests</tspan></text>
<text x="380" y="391" fill="#616e7f">. <tspan fill="#ffa657">Practices</tspan> ..... <tspan fill="#a5d6ff">TDD, code reviews, Agile / Scrum</tspan></text>
<text x="380" y="414" fill="#616e7f">. <tspan fill="#ffa657">Tools</tspan> ......... <tspan fill="#a5d6ff">Git, Swagger, JIRA, Confluence</tspan></text>
